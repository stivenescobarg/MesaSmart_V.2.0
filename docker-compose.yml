services:
  backend:
    build:
      context: ./backend
    container_name: mesasmart-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: mesasmart-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend